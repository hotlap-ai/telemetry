name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.1)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): npm trusts this workflow file in this repo,
    # so there is no NPM_TOKEN to leak or expire. Configure it on npmjs.com
    # under @hotlap.ai/telemetry → Settings → Trusted publisher (GitHub
    # Actions, hotlap-ai / telemetry / publish.yml, direct `npm publish`
    # allowed). Requires npm >= 11.5.1 and a GitHub-hosted runner.
    permissions:
      contents: read
      id-token: write # required for OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: bun install

      - name: Update version from release tag
        if: github.event_name == 'release'
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "Publishing version: $VERSION"
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Update version from input
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "Publishing version: $VERSION"
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Build package
        run: bun run build

      - name: Test
        run: bun test

      # Provenance is generated automatically for trusted publishes.
      - name: Publish to npm
        run: npm publish --access public
